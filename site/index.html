<!doctype html>
<!--
  Oak workspace. Open it locally from the repo root:
    npm install    (once)
    npm run wiki   (builds the data, serves http://localhost:4410, live-reloads)
  Without graph.json the app loads
  sample-graph.json (fake people and work). See scripts/wiki/README.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oak Workspace</title>
  <meta name="description" content="Team 48's workspace for Oak, the Go2 robot dog: pages, a map of how they connect, and who is working on what.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#reader">Skip to page</a>
  <div class="app" id="app">
    <!-- Left: pages, people, recent -->
    <aside class="side" id="side" aria-label="Workspace">
      <div class="side-head">
        <button class="brand" id="home" type="button" title="Open Oak">Oak</button>
        <button class="icon-btn only-wide" id="side-hide" type="button" aria-label="Hide sidebar" title="Hide sidebar ([)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
        </button>
        <button class="icon-btn only-narrow" id="side-close" type="button" aria-label="Close menu">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="search-btn" id="search-open" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Search</span>
        <kbd>/</kbd>
      </button>
      <div class="side-scroll">
        <nav class="side-sec" aria-labelledby="h-tree">
          <h2 class="side-h" id="h-tree">Pages</h2>
          <ul class="tree" id="tree"></ul>
        </nav>
        <section class="side-sec" aria-labelledby="h-people">
          <div class="side-h-row">
            <h2 class="side-h" id="h-people">People</h2>
            <button type="button" class="side-tog" id="work-tog" aria-expanded="false" aria-controls="work">All open work</button>
          </div>
          <ul class="people-list" id="people-list"></ul>
          <ul class="feed all-work" id="work" hidden></ul>
        </section>
        <section class="side-sec" aria-labelledby="h-recent">
          <h2 class="side-h" id="h-recent">Recent changes</h2>
          <ul class="feed" id="recent"></ul>
        </section>
      </div>
      <div class="side-foot" id="data-note"></div>
    </aside>

    <!-- Middle: the page -->
    <main class="reader" id="reader" tabindex="-1">
      <div class="sizer" id="size-side" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0" title="Drag to resize, double-click to reset"></div>
      <div class="reader-bar">
        <button class="icon-btn only-wide" id="side-show" type="button" aria-label="Show sidebar" title="Show sidebar ([)" hidden>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
        </button>
        <button class="icon-btn only-narrow" id="side-open" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="find" id="find" role="search" aria-label="Matches on this page" hidden>
          <span class="find-text" id="find-text" aria-live="polite"></span>
          <button type="button" class="icon-btn" id="find-prev" aria-label="Previous match" title="Previous match (Shift Enter)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 10l4-4 4 4"/></svg>
          </button>
          <button type="button" class="icon-btn" id="find-next" aria-label="Next match" title="Next match (Enter)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>
          </button>
          <button type="button" class="icon-btn" id="find-close" aria-label="Clear highlights" title="Clear highlights (Esc)">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <a class="bar-link" href="#ask" id="ask-jump">Ask</a>
        <button class="icon-btn" id="map-tog" type="button" aria-controls="map" aria-pressed="true" title="Show or hide the map (M)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><path d="M5.8 4.7l4.4.9M4.7 5.9l.8 4.2M10.6 7.4l-3.2 3.3"/></svg>
          <span class="sr-only">Map</span>
        </button>
      </div>
      <div class="reader-scroll" id="reader-scroll">
        <div class="page" id="page">
          <article class="md" id="content"><p class="loading">Loading the workspace...</p></article>
          <section class="connections" id="connections" aria-labelledby="h-conn"></section>
          <section class="backlinks" id="backlinks" aria-labelledby="h-back"></section>
          <section class="ask" id="ask" aria-labelledby="h-ask">
            <h2 id="h-ask">Ask or change this page</h2>
            <div class="ask-quick" role="group" aria-label="Instant answers">
              <button type="button" class="chip" data-q="who">Who is working on this?</button>
              <button type="button" class="chip" data-q="recent">What changed recently?</button>
              <button type="button" class="chip" data-q="open">What's open here?</button>
            </div>
            <div class="answer" id="answer" aria-live="polite" hidden></div>
            <form class="ask-form" id="ask-form">
              <div class="quote" id="ask-quote" hidden>
                <span class="quote-label">About this part:</span>
                <q class="quote-text" id="ask-quote-text"></q>
                <button type="button" class="icon-btn" id="ask-quote-x" aria-label="Remove the quoted part">
                  <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
              </div>
              <label class="sr-only" for="ask-input">Your question or the change you want</label>
              <div class="composer">
                <input id="ask-input" type="text" placeholder="Ask a question or describe a change. Type [[ to name a page." autocomplete="off"
                       role="combobox" aria-expanded="false" aria-controls="ask-pages" aria-autocomplete="list">
                <button type="button" class="btn primary" id="ask-agent">Copy for agent</button>
              </div>
              <ul class="ask-pages" id="ask-pages" role="listbox" aria-label="Pages" hidden></ul>
              <div class="ask-meta">
                <div class="seg" role="group" aria-label="What the agent should do">
                  <button type="button" data-mode="ask" aria-pressed="true">Answer a question</button>
                  <button type="button" data-mode="edit" aria-pressed="false">Edit this page</button>
                </div>
                <button type="submit" class="link-btn" id="ask-team" title="Opens a GitHub issue for this page in a new tab">Ask the team instead</button>
              </div>
              <p class="hint" id="ask-hint"></p>
              <div class="copy-fallback" id="copy-fallback" hidden>
                <label for="copy-text">Copy this prompt:</label>
                <textarea id="copy-text" rows="6" readonly></textarea>
              </div>
              <p class="toast" id="toast" role="status" aria-live="polite"></p>
            </form>
            <div id="saved"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- Right: the map -->
    <section class="map" id="map" aria-labelledby="h-map">
      <div class="sizer" id="size-map" role="separator" aria-orientation="vertical" aria-label="Resize the map" tabindex="0" title="Drag to resize, double-click to reset"></div>
      <h2 class="sr-only" id="h-map">Map</h2>
      <div class="map-stage" id="stage">
        <canvas id="graph" role="img" aria-label="Map of the pages around Oak. A page takes a teammate's color when they are working on it. Use the page list for keyboard navigation."></canvas>
        <div class="map-tip" id="tip" hidden></div>
        <div class="map-zoom" role="group" aria-label="Map zoom">
          <button type="button" class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" class="icon-btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
          <button type="button" class="icon-btn" id="zoom-fit" aria-label="Fit the whole map">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
        <div class="map-legend" id="legend" role="group" aria-label="Show a teammate's pages"></div>
      </div>
    </section>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <!-- appears over selected page text -->
  <button type="button" class="sel-ask" id="sel-ask" hidden>Ask agent about this</button>

  <!-- Quick switcher: / or Ctrl K -->
  <div class="qs-back" id="qs" hidden>
    <div class="qs" role="dialog" aria-modal="true" aria-label="Go to a page">
      <div class="qs-input">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <label class="sr-only" for="search">Search pages, people and work</label>
        <input id="search" type="text" placeholder="Go to a page, person or pull request" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
        <kbd>esc</kbd>
      </div>
      <ul id="results" class="results" role="listbox"></ul>
      <div class="qs-foot" aria-hidden="true"><span>&uarr; &darr; move</span><span>Enter open</span><span>Esc close</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="graph.js" onerror="this.remove()"></script>
  <script src="app.js"></script>
</body>
</html>
