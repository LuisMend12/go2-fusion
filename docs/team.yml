# Team 48 - who works on Oak.
#
# Read by scripts/wiki/build_graph.py (the wiki site) and
# scripts/wiki/discord_ping.py (Discord pings). Keep this simple shape:
# one "- id:" block per person, one "key: value" per line.
#
# id          short lowercase id used everywhere else in the data
# github      GitHub login (checked against the repo's commit history)
# color       that person's color on the site. Readable on the dark
#             background and kept away from the hub colors (blue, orange,
#             mint green, cyan, yellow, pink, violet) and Oak's near-white:
#             red, lime, tan, slate gray, warm ivory.
# discord_id  numeric Discord user id, so pings can @mention them.
#             Empty until filled in (Discord: Settings > Advanced >
#             Developer Mode, then right-click the name > Copy User ID).
# focus       one line, what they are working on now
