# Posts to the team Discord when someone asks a wiki question (an issue
# labelled "question") or a pull request asks for review.
# Code: scripts/wiki/discord_ping.py. No AI, no cost.
#
# One-time setup: create a Discord webhook (channel > Edit Channel >
# Integrations > Webhooks > New Webhook > Copy URL) and save it as the repo
# secret DISCORD_WEBHOOK_URL (Settings > Secrets and variables > Actions).
# Until then this workflow logs "Discord not set up yet" and passes.
#
# Pull requests use pull_request_target so pull requests from forks can read
# the secret. It runs this workflow from master and never checks out or runs
# the pull request's code.
name: Discord ping

on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [review_requested, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0  # history, to find each page's last changer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build graph.json (team, pages, open work)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WIKI_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/wiki/build_graph.py
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/wiki/discord_ping.py
