# Builds the Oak workspace data (scripts/wiki/build_graph.py) and deploys
# site/ to GitHub Pages.
#
# One-time setup: GitHub Pages must be enabled for this repo with
#   Settings > Pages > Source: GitHub Actions
# Until then the deploy step fails; the build step still checks the wiki.
#
# The site always shows master. Besides pushes to master, it rebuilds when
# issues, comments or pull requests change (so "Working on now", questions
# and review requests stay current) and every 6 hours.
#
# Pull requests use pull_request_target: it runs this workflow from master
# (never the pull request's code), so pull requests from forks also refresh
# the site and the Pages deploy stays on the default branch.
name: Wiki site

on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/wiki/**
      - docs/team.yml
      - scripts/wiki/**
      - site/**
      - .github/workflows/wiki-site.yml
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, synchronize, reopened, review_requested, ready_for_review, closed]
  schedule:
    - cron: "17 * * * *"  # hourly safety net; events above cover most changes
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: wiki-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always master, never the pull request's code.
          ref: ${{ github.event.repository.default_branch }}
          # Full history for "last change" and "recent". With depth 0, checkout
          # also fetches every branch into refs/remotes/origin/*, which
          # "Active branches" reads.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build graph.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WIKI_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/wiki/build_graph.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
